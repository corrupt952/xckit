version: 2

builds:
  - flags:
      - -trimpath
    ldflags:
      - -s -w -X {{ .ModulePath }}/command.Version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Dependencies
      regexp: '^.*?chore\(deps\)!?:.+$'
      order: 2
    - title: Others
      order: 999
