name: Release

on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26
          # A tag-triggered release build is a poor fit for the module/build
          # cache: it runs once per tag and is exactly the kind of workflow
          # cache-poisoning attacks target.
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # A semver range instead of "latest" so a GoReleaser major bump
          # can't silently change release behavior underneath a tag push.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # subject-path expands globs; subject-checksums does not — a value
          # that is not an existing file is parsed as literal checksums
          # content, so "dist/*_checksums.txt" resolved to zero subjects while
          # the step still reported success. The archives carry the same names
          # and digests the checksums file lists, and a glob that matches
          # nothing fails the step instead of attesting nothing.
          subject-path: dist/*.tar.gz
